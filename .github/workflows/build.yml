name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build desktop
        shell: cmd
        run: apexcam_pc\build.bat "%GITHUB_WORKSPACE%\artifacts"
      - name: Test desktop
        shell: pwsh
        run: |
          $compiler="$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          Copy-Item artifacts/LensioStudio.exe ./LensioStudio.exe
          foreach($name in @('FilterBehaviorSmoke','OverlayGeometrySmoke','CameraCompositionSmoke','MultiDeviceSmoke','StudioLayoutSmoke','WorkspacePersistenceSmoke','GitHubUpdaterSmoke')) {
            $source=Join-Path $env:GITHUB_WORKSPACE "tests\$name.cs"
            $output=Join-Path $env:GITHUB_WORKSPACE "$name.exe"
            & $compiler /nologo '/r:System.dll,System.Core.dll,System.Drawing.dll,System.Windows.Forms.dll,System.Web.Extensions.dll' '/r:LensioStudio.exe' "/out:$output" $source
            if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
            & ".\$name.exe"
            if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          }
      - uses: actions/upload-artifact@v4
        with:
          name: LensioStudio-build
          path: artifacts/LensioStudio.exe
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: 'false'
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Build and test Android
        run: |
          chmod +x apexcam/android/gradlew
          apexcam/android/gradlew -p apexcam/android --no-daemon testDebugUnitTest assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: LensioCam-ci-build-not-for-updates
          path: apexcam/android/app/build/outputs/apk/debug/app-debug.apk
