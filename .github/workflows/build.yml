name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build desktop
        shell: cmd
        run: LensioStudio\build.bat "%GITHUB_WORKSPACE%\artifacts"
      - name: Test desktop
        shell: pwsh
        run: |
          $compiler="$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          Copy-Item artifacts/LensioStudio.exe ./LensioStudio.exe
          foreach($name in @('PixelKernelSmoke','FramePumpSmoke','CameraCardsSmoke','BrandingSmoke','FilterBehaviorSmoke','SourceEditingSmoke','ShortcutPropertiesSmoke','PairingQrSmoke','ImageCacheSmoke','OverlayGeometrySmoke','CameraCompositionSmoke','MultiDeviceSmoke','StudioLayoutSmoke','WorkspacePersistenceSmoke','GitHubUpdaterSmoke','WebCameraBridgeSmoke','BundledSetupSmoke','VirtualCameraQueueSmoke','UpdateSetupSmoke')) {
            $source=Join-Path $env:GITHUB_WORKSPACE "tests\$name.cs"
            $output=Join-Path $env:GITHUB_WORKSPACE "$name.exe"
            & $compiler /nologo '/r:System.dll,System.Core.dll,System.Drawing.dll,System.Windows.Forms.dll,System.Web.Extensions.dll' '/r:LensioStudio.exe' "/out:$output" $source
            if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
            & ".\$name.exe"
            if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
            if($name -eq 'PixelKernelSmoke') {
              & ".\$name.exe" --managed
              if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
            }
          }
      - name: Test AVC reception
        shell: pwsh
        run: |
          & ./build/codec64/Release/GenerateAvcFixture.exe "$env:GITHUB_WORKSPACE/build/avc-test.bin"
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $compiler="$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          foreach($name in @('AvcDecodeSmoke','AvcReceiverSmoke')) {
            $source=Join-Path $env:GITHUB_WORKSPACE "tests\$name.cs"
            $output=Join-Path $env:GITHUB_WORKSPACE "$name.exe"
            & $compiler /nologo '/r:System.dll,System.Core.dll,System.Drawing.dll,System.Windows.Forms.dll' '/r:LensioStudio.exe' "/out:$output" $source
            if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
            & "./$name.exe" "$env:GITHUB_WORKSPACE/build/avc-test.bin"
            if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          }
      - uses: actions/upload-artifact@v4
        with:
          name: LensioStudio-build
          path: artifacts/LensioStudio.exe
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: 'false'
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Build and test Android
        run: |
          chmod +x LensioCam/android/gradlew
          LensioCam/android/gradlew -p LensioCam/android --no-daemon testDebugUnitTest assembleDebug lintDebug
      - name: Test exact native YUV copies
        run: |
          cmake -S tests/native-yuv -B build/yuv-tests -DCMAKE_BUILD_TYPE=Release
          cmake --build build/yuv-tests
          ctest --test-dir build/yuv-tests --output-on-failure
          KOTLIN_CP="LensioCam/android/app/build/tmp/kotlin-classes/debug"
          for jar in "$HOME"/.gradle/caches/modules-2/files-2.1/org.jetbrains.kotlin/kotlin-stdlib/*/*/kotlin-stdlib-*.jar; do
            KOTLIN_CP="$KOTLIN_CP:$jar"
          done
          javac -cp "$KOTLIN_CP" -d build/yuv-tests tests/NativeYuvJniSmoke.java
          java -Djava.library.path=build/yuv-tests -cp "$KOTLIN_CP:build/yuv-tests" NativeYuvJniSmoke
      - uses: actions/upload-artifact@v4
        with:
          name: LensioCam-ci-build-not-for-updates
          path: LensioCam/android/app/build/outputs/apk/debug/app-debug.apk
