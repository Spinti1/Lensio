<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d1119">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="Connect your phone camera to LensioStudio.">
  <title>LensioCam</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css?v=7">
</head>
<body data-phase="off">
  <main aria-label="LensioCam">
    <section class="preview" aria-label="Camera preview">
      <video id="localVideo" autoplay muted playsinline aria-label="Live camera preview"></video>
      <span id="state" class="status" role="status" aria-live="polite">Camera off</span>
      <div id="placeholder" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none"><path d="M8 15h9l3-5h8l3 5h9v23H8z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="24" cy="26" r="7" stroke="currentColor" stroke-width="2"/></svg>
      </div>
      <p id="message" role="alert" hidden></p>
    </section>
    <div class="toolbar">
      <button id="start" class="primary">Start camera &amp; connect</button>
      <button id="stop" disabled>Stop</button>
    </div>
  </main>
  <script type="module" src="app.js?v=7"></script>
</body>
</html>
